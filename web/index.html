<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropTop Workspace</title>
    
    <!-- Google Material Fonts & Design Token Symbols -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link href="https://googleapis.com" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

    <!-- Import Polished Material 3 Custom Elements via ESM Modules -->
    <script type="module">
        import '@material/web/button/filled-button.js';
        import '@material/web/button/elevation.js';
        import '@material/web/ripple/ripple.js';
        import '@material/web/icon/icon.js';
    </script>
</head>
<body>

    <!-- Main Application Shell Container -->
    <main class="workspace-container">
        
        <!-- Interactive Header Bar Structure -->
        <header class="m3-top-app-bar">
            <div class="app-bar-leading">
                <span class="material-symbols-rounded">layers</span>
                <h1 class="m3-title">CropTop Canvas</h1>
            </div>
            
            <div class="app-bar-actions" style="display: flex; gap: 12px;">
                <input type="file" id="screenshot-upload-picker" accept="image/*" multiple style="display: none;">
                <md-filled-button id="upload-trigger">
                    <md-icon slot="icon">add_photo_alternate</md-icon>
                    Upload Screenshots
                </md-filled-button>
                
                <md-filled-button id="download-trigger">
                    <md-icon slot="icon">download</md-icon>
                    Export Stitch
                </md-filled-button>
            </div>
        </header>

        <!-- Dynamic Scale Container Wrapper for Zoom Engine -->
        <div class="zoom-viewport-wrapper">
            <!-- The Layer Stacking Canvas Workspace -->
            <section id="stitch-viewport" class="m3-surface">
                <div class="empty-state-notice">
                    <span class="material-symbols-rounded" style="font-size: 48px;">photo_library</span>
                    <p>Upload screenshots to begin interactive stitching</p>
                </div>
            </section>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
